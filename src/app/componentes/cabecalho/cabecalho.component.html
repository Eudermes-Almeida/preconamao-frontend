<header class="cabecalho-app">
  <img class="logo" src="assets/logomarca-simplifica-compras.jpg" alt="Simplifica Compras" />

  <span class="versao">{{ versaoApp }}</span>

  <button type="button" class="btn-limpar" (click)="limpar.emit()">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
      <path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12ZM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4Z"/>
    </svg>
    Limpar
  </button>
</header>

<!-- Em qual loja os preços valem: sempre visível (decisão de 02/10/2026). -->
@if (loja.lojaExibida(); as atual) {
  <div class="faixa-loja" role="status">
    <span class="faixa-loja-nome">📍 {{ atual.nome }}</span>
    @if (loja.exigir()) {
      <button type="button" class="faixa-loja-trocar" (click)="loja.abrirEscolha()">Trocar</button>
    }
  </div>
} @else if (loja.exigir()) {
  <div class="faixa-loja faixa-loja-sem" role="status">
    <span class="faixa-loja-nome">📍 Nenhuma loja escolhida</span>
    <button type="button" class="faixa-loja-trocar" (click)="loja.abrirEscolha()">Escolher</button>
  </div>
}
