<section class="ofertas" aria-labelledby="tituloOfertas">

  <header class="topo">
    <h2 id="tituloOfertas" class="titulo">Ofertas</h2>
    <button type="button" class="btn-filtro-favoritas" [class.ativo]="somenteFavoritas()"
      [attr.aria-pressed]="somenteFavoritas()" [disabled]="ofertas.totalFavoritas() === 0"
      (click)="ofertas.alternarSomenteFavoritas()">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 21.35 10.55 20C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35Z"/></svg>
      {{ somenteFavoritas() ? 'Ver todas as ofertas' : 'Só favoritas' }}
      @if (ofertas.totalFavoritas() > 0) {
        <span class="contador-favoritas">{{ ofertas.totalFavoritas() }}</span>
      }
    </button>
    <!-- Com as ofertas abertas, os 6 botões de função somem; fechar os traz de volta. -->
    <button type="button" class="btn-fechar" aria-label="Fechar ofertas" (click)="fechar.emit()">✕</button>
  </header>

  @if (ofertas.totalFavoritas() === 0) {
    <p class="dica">Toque no coração de uma oferta para favoritá-la.</p>
  }

  <ul class="grade">
    @for (oferta of visiveis(); track oferta.codigoBarras) {
      <li class="card" #card [attr.data-codigo]="oferta.codigoBarras">
        <div class="moldura">
          <app-oferta-imagem class="imagem" [imagem]="oferta.imagem" [alt]="descricao(oferta) ?? 'Oferta'"
            [produto]="ofertas.produtos()?.[oferta.codigoBarras]" [carregamentoPreguicoso]="true" />
          <button type="button" class="btn-favoritar" [class.favorita]="ofertas.ehFavorita(oferta.codigoBarras)"
            [attr.aria-pressed]="ofertas.ehFavorita(oferta.codigoBarras)"
            [attr.aria-label]="ofertas.ehFavorita(oferta.codigoBarras) ? 'Desfavoritar oferta' : 'Favoritar oferta'"
            (click)="alternarFavorita(oferta.codigoBarras)">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 21.35 10.55 20C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35Z"/></svg>
          </button>
        </div>

        <button type="button" class="btn-acao btn-localizar" (click)="localizarOferta(oferta.codigoBarras)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg>
          Localizar produto
        </button>
        <button type="button" class="btn-acao btn-pre-lista" [class.na-lista]="preLista.temProduto(oferta.codigoBarras)"
          [disabled]="!descricao(oferta)" [attr.aria-pressed]="preLista.temProduto(oferta.codigoBarras)"
          (click)="alternarPreLista(oferta)">
          @if (preLista.temProduto(oferta.codigoBarras)) {
            ✓ Na pré-lista
          } @else {
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M22 7h-9v2h9V7Zm0 8h-9v2h9v-2ZM5.54 11 2 7.46l1.41-1.41 2.12 2.12 4.24-4.24 1.41 1.41L5.54 11Zm0 8L2 15.46l1.41-1.41 2.12 2.12 4.24-4.24 1.41 1.41L5.54 19Z"/></svg>
            <span>Incluir na <span class="sem-quebra">pré-lista</span></span>
          }
        </button>
        @if (loja.lojaDasOfertas(); as daLoja) {
          <p class="valido-loja">Válido somente no {{ daLoja.nome }}</p>
        }
      </li>
    }
  </ul>

</section>
