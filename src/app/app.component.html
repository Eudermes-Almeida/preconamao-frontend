<app-cabecalho (limpar)="pedirConfirmacaoDeLimpeza()" />
<app-scanner-produto [leitorPausado]="confirmandoLimpeza" />
<app-rodape />

@if (confirmandoLimpeza) {
  <app-modal-confirmacao
    titulo="Limpar tudo?"
    mensagem="O carrinho será esvaziado permanentemente e a tela voltará para a posição inicial."
    textoConfirmar="Limpar tudo"
    (confirmar)="confirmarLimpeza()"
    (cancelar)="cancelarLimpeza()" />
}
